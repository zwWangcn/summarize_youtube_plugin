<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="extensionName">YouTube AI 总结与翻译</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <img class="brand-icon" src="/assets/icons/icon48.png" width="40" height="40" alt="" />
      <h1 data-i18n="extensionName">YouTube AI 总结与翻译</h1>
      <p class="subtitle" data-i18n="popupSubtitle">一键总结视频，翻译字幕</p>
    </header>

    <main class="main">
      <!-- Provider selector -->
      <section class="section">
        <label class="label" for="provider" data-i18n="providerLabel">AI 供应商</label>
        <select id="provider" class="input">
        </select>
      </section>

      <!-- Model selector -->
      <section class="section">
        <label class="label" for="model" data-i18n="modelLabel">模型</label>
        <select id="model" class="input">
        </select>
      </section>

      <!-- Output language -->
      <section class="section">
        <label class="label" for="outputLanguage" data-i18n="outputLanguageLabel">总结与翻译语言</label>
        <select id="outputLanguage" class="input"></select>
        <p class="hint" data-i18n="outputLanguageHint">同时用于 AI 总结和字幕译文</p>
      </section>

      <section class="section setting-toggle-row">
        <div>
          <label class="label" for="learningMode" data-i18n="learningModeLabel">学习模式</label>
          <p class="hint setting-toggle-hint" data-i18n="learningModeHint">只在鼠标悬停字幕时显示译文</p>
        </div>
        <input id="learningMode" type="checkbox" class="setting-toggle" />
      </section>

      <!-- Model info card -->
      <section id="modelInfo" class="model-info">
        <div class="info-row">
          <span class="info-label" data-i18n="paramSizeLabel">参数等级</span>
          <span id="infoParamSize" class="info-value">—</span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="pricingLabel">输入 / 输出</span>
          <span id="infoPricing" class="info-value">—</span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="contextWindowLabel">上下文窗口</span>
          <span id="infoContext" class="info-value">—</span>
        </div>
        <div class="info-row">
          <span class="info-label" data-i18n="descriptionLabel">简介</span>
          <span id="infoDesc" class="info-value">—</span>
        </div>
      </section>

      <!-- API Key -->
      <section class="section">
        <label class="label" for="apiKey">
          <span id="apiKeyLabel">API Key</span>
        </label>
        <div class="input-row">
          <input
            type="password"
            id="apiKey"
            class="input"
            placeholder="sk-..."
            autocomplete="off"
          />
          <button id="toggleKey" class="btn-icon" title="显示/隐藏" data-i18n="showKey" data-i18n-title="toggleKeyTitle">显示</button>
        </div>
        <p class="hint">
          在
          <a id="apiKeyLink" href="#" target="_blank" rel="noopener" data-i18n="getApiKey">获取 API Key</a>
        </p>
      </section>

      <!-- Data disclosure -->
      <section class="privacy-notice">
        <p data-i18n="dataDisclosure">
          执行总结或翻译时，视频字幕和 API Key 会直接发送给你选择的 AI 服务商；开发者不会接收这些数据。
        </p>
        <a
          class="privacy-link"
          href="https://github.com/zwWangcn/summarize_youtube_plugin/blob/main/PRIVACY.md"
          target="_blank"
          rel="noopener"
          data-i18n="privacyPolicy"
        >隐私政策</a>
      </section>

      <!-- Status -->
      <div id="status" class="status"></div>

      <!-- Save -->
      <button id="saveBtn" class="btn-primary" data-i18n="saveSettings">保存设置</button>
      <button id="clearKeysBtn" class="btn-secondary" data-i18n="clearAllApiKeys">删除本设备全部 API Key</button>
    </main>

    <footer class="footer">
      <p data-i18n="popupFooter">打开 YouTube 视频，在播放器中点击“AI 总结与翻译”即可使用</p>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
